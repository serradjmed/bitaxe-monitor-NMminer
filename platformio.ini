; Bitaxe Monitor for ESP32-2432S028R (NMMiner / CYD 2.8")
; ------------------------------------------------------------
; Default target: NMMiner-branded CYD with ST7789 panel.
; Other targets are provided for ILI9341 panels and colour variants.

[platformio]
default_envs = cyd-st7789
src_dir = src
lib_dir = lib

[common]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT8=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

extra_scripts =
    post:tools/merge_bin.py

[env:cyd-st7789]
extends = common
build_flags =
    ${common.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1

[env:cyd-st7789-rgb]
extends = common
build_flags =
    ${common.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_OFF=1

[env:cyd-st7789-inv]
extends = common
build_flags =
    ${common.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

[env:cyd-ili9341]
extends = common
build_flags =
    ${common.build_flags}
    -D ILI9341_2_DRIVER=1
